[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiji"
version = "0.1.0"
description = "知记：把各平台知识视频/图文整理成结构化 Markdown 笔记"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "playwright>=1.49",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "yt-dlp>=2024.8.6",
  "curl-cffi>=0.7",
  "html2text>=2024.2.26",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
zhiji = "zhiji.cli:app_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 这些第三方库已安装但未携带类型信息（无 py.typed），跳过其内部检查
[[tool.mypy.overrides]]
module = ["yaml", "yt_dlp", "faster_whisper"]
ignore_missing_imports = true
