<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知记 zhiji</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/app.css">

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">知</div>
      <div>
        <div class="brand-name">知记 zhiji</div>
        <div class="brand-sub" id="health">连接中</div>
      </div>
    </div>
    <button class="new-chat" id="btn-new" type="button">
      <i data-lucide="plus"></i><span>新建笔记</span>
    </button>
    <div class="search">
      <i data-lucide="search"></i>
      <input id="conv-search" placeholder="搜索会话" autocomplete="off">
    </div>
    <nav class="conv-list" id="conv-list"></nav>
    <div class="sidebar-foot">
      <button class="foot-btn" id="btn-settings" type="button">
        <i data-lucide="settings"></i><span>设置</span>
      </button>
      <div class="model-mini">
        <i data-lucide="cpu"></i><span id="model-mini-text">未配置模型</span>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="打开会话列表">
        <i data-lucide="menu"></i>
      </button>
      <div style="min-width:0">
        <h1 id="conv-title">新建笔记</h1>
        <div class="top-meta" id="conv-meta"></div>
      </div>
      <div class="top-right">
        <select class="model-select" id="model-select" aria-label="选择模型"></select>
      </div>
    </header>
    <section class="scroll-area" id="scroll">
      <div class="wrap" id="wrap"></div>
    </section>
    <div class="composer-wrap hidden" id="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="针对笔记提问，或要求修改笔记" rows="1"></textarea>
        <button class="send-btn" id="btn-send" type="button" aria-label="发送">
          <i data-lucide="arrow-up"></i>
        </button>
      </div>
      <div class="composer-hint" id="composer-hint"></div>
    </div>
  </main>
</div>
<div class="settings-page hidden" id="settings-page" aria-hidden="true">
  <aside class="settings-nav">
    <div class="settings-nav-group">设置</div>
    <button class="settings-nav-item active" data-tab="models" type="button">
      <i data-lucide="cpu"></i><span>模型</span>
    </button>
    <button class="settings-nav-item" data-tab="path" type="button">
      <i data-lucide="folder"></i><span>保存路径</span>
    </button>
    <button class="settings-nav-item" data-tab="general" type="button">
      <i data-lucide="sliders-horizontal"></i><span>通用</span>
    </button>
    <button class="settings-nav-item" data-tab="cookies" type="button">
      <i data-lucide="key-round"></i><span>Cookie</span>
    </button>
  </aside>
  <div class="settings-main">
    <header class="settings-head">
      <div>
        <h2 id="settings-title">模型</h2>
        <div class="settings-sub" id="settings-sub"></div>
      </div>
      <button class="icon-btn" id="btn-close-settings" type="button" aria-label="关闭">
        <i data-lucide="x"></i>
      </button>
    </header>
    <div class="settings-body" id="settings-body"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
